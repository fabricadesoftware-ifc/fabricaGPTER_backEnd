[project]
name = "fabricagpter-backend"
version = "0.1.0"
description = "Base da API do projeto Fábrica GPTER"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.8,<5.3",
    "djangorestframework>=3.16,<3.17",
    "django-cors-headers>=4.9,<5",
    "python-dotenv>=1.1,<2",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python manage.py runserver 127.0.0.1:19003"
test = "python manage.py test"
check = "python manage.py check"
migrate = "python manage.py migrate"
